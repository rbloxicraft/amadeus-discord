<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Amadeus Stage</title>
  <!-- Scène du stream Discord : avatar + fond, aucune interface. Filmée en arrière-plan
       par le bot (navigateur sans fenêtre) et diffusée en Go Live. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.4/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/css/amadeus.css?v=s1" />
  <style>
    html, body { cursor: none; }
    #app { pointer-events: none; }
    /* pas de tiroir à côté : le compteur reste à sa place */
    #divergence { top: 9%; right: 5%; }
    /* sous-titres : grands, pour rester lisibles une fois le stream réduit dans Discord */
    #dialogue { bottom: 4%; padding: 0 6%; }
    #subtitle { width: min(1000px, 100%); padding: 24px 32px 18px; }
    .sub-main { font-size: 34px; line-height: 1.35; }
    .sub-ja { font-size: 22px; }
    .nameplate { font-size: 15px; padding: 2px 14px 3px; }
    body.no-subtitles #dialogue { display: none; }
    #subtitle.long .sub-main { font-size: 28px; }
    #subtitle.long .sub-ja { font-size: 18px; }
    #subtitle.very-long .sub-main { font-size: 24px; line-height: 1.3; }
  </style>
</head>
<body class="stage">
  <div id="backdrop" aria-hidden="true">
    <canvas id="screen-bg" hidden></canvas>
    <div id="divergence">
      <p class="dm-label">Divergence</p>
      <div class="dm-device">
        <div class="dm-tubes"></div>
        <div class="dm-chassis"><i></i><i></i><i></i><i></i></div>
      </div>
      <svg width="0" height="0" style="position:absolute">
        <filter id="nixie-glow" x="-60%" y="-30%" width="220%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="near" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.6" result="far" />
          <feMerge><feMergeNode in="far" /><feMergeNode in="far" /><feMergeNode in="near" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </svg>
      <ol class="dm-history"></ol>
    </div>
  </div>
  <div id="app">
    <canvas id="scene"></canvas>
    <!-- sous-titres de ce qu'elle dit (lisibles sur le stream) -->
    <section id="dialogue">
      <div id="subtitle" class="idle">
        <span class="nameplate">Amadeus</span>
        <p class="sub-main"></p>
        <p class="sub-ja" lang="ja"></p>
      </div>
    </section>
  </div>
  <script type="module" src="/js/stage.js?v=3"></script>
</body>
</html>
